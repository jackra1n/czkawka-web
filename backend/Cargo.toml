[package]
name = "backend"
version = "1.2.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
tokio = { version = "1.52.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.1", features = ["v4"] }
czkawka_core = { git = "https://github.com/qarmin/czkawka.git", rev = "500e210ede17da58641603aa9aa51ed09f6b1000" }
dirs = "6.0.0"
log = "0.4"
env_logger = "0.11"
mime_guess = "2.0.5"
infer = "0.19"
crossbeam-channel = "0.5.15"
